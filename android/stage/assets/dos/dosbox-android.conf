# DOSBox-X configuration for the Android build, tuned for Duke Nukem 3D.
# Mirrors the settings proven out by the web (wasm) build's z_duke3d.conf.

[sdl]
fullscreen = true
autolock   = false
output     = surface
showmenu   = false

[dosbox]
machine  = svga_s3
memsize  = 32
captures = /data/data/org.nukemnet.dosboxx/files/dos/captures

[render]
aspect = true

[cpu]
core    = auto
cputype = auto
cycles  = auto

[sblaster]
sbtype = sb16
sbbase = 220
irq    = 7
dma    = 1
hdma   = 5

[mixer]
rate      = 44100
blocksize = 1024

[autoexec]
mount c /data/data/org.nukemnet.dosboxx/files/dos
c:
cd DUKE3D
DUKE3D.EXE
