<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- DOSBox-X-NN: chunky "DOS" letters and a cartoon "X" in the spirit of DOSBox-X,
       with NukemNet's trefoil where the X's strokes cross. -->
  <defs>
    <linearGradient id="x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8f0a0"/><stop offset="0.5" stop-color="#3fc83a"/><stop offset="1" stop-color="#1a8526"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3a4a9a"/><stop offset="1" stop-color="#141a40"/>
    </radialGradient>
    <radialGradient id="blade" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#9cf59a"/><stop offset="0.6" stop-color="#3cbf3f"/><stop offset="1" stop-color="#176b22"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fffbb0"/><stop offset="0.6" stop-color="#ffd12a"/><stop offset="1" stop-color="#c98a00"/>
    </radialGradient>
    <g id="arms">
      <rect x="-31" y="-110" width="62" height="220" rx="20"/>
      <rect x="-31" y="-110" width="62" height="220" rx="20" transform="rotate(90)"/>
    </g>
    <path id="b" d="M 0 -18 A 18 18 0 0 1 15.6 -9 L 41.6 -24 A 48 48 0 0 0 0 -48 Z"/>
  
    <linearGradient id="dred" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#d9361a"/></linearGradient>
    <linearGradient id="dpurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e08cff"/><stop offset="1" stop-color="#9a2fd0"/></linearGradient>
    <linearGradient id="dyellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7a0"/><stop offset="1" stop-color="#f2c400"/></linearGradient>
  </defs>
  <g transform="translate(146 160) scale(0.8) translate(-126 -126)">
  <g transform="translate(126 126) rotate(41)">
    <use href="#arms" transform="translate(6 7) rotate(-41) translate(0 0) rotate(41)" fill="#000" opacity="0.35"/>
    <use href="#arms" fill="#111" stroke="#111" stroke-width="20" stroke-linejoin="round"/>
    <use href="#arms" fill="url(#x)"/>
    <!-- cartoon gloss along each arm -->
    <rect x="-22" y="-100" width="15" height="70" rx="7" fill="url(#gloss)"/>
    <rect x="-22" y="-100" width="15" height="70" rx="7" fill="url(#gloss)" transform="rotate(90)"/>
  </g>
  <g transform="translate(126 126)">
    <circle r="62" fill="#111"/>
    <circle r="53" fill="url(#disc)"/>
    <g fill="url(#blade)" stroke="#0a3a10" stroke-width="2.5" stroke-linejoin="round">
      <use href="#b" transform="rotate(-30)"/>
      <use href="#b" transform="rotate(90)"/>
      <use href="#b" transform="rotate(210)"/>
    </g>
    <circle r="12.5" fill="url(#core)" stroke="#5a4200" stroke-width="2.5"/>
    <ellipse cx="-18" cy="-28" rx="16" ry="7" fill="#fff" opacity="0.18" transform="rotate(-30)"/>
  </g>
  </g>
  <!-- "DOS" in chunky cartoon letters: shadow, black outline, coloured stroke -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g transform="translate(44 50) rotate(-12) scale(0.9)">
      <path d="M -10 -27 V 27 H 0 A 27 27 0 0 0 0 -27 Z" stroke="#000" stroke-width="24" transform="translate(5 6)" opacity="0.3"/>
      <path d="M -10 -27 V 27 H 0 A 27 27 0 0 0 0 -27 Z" stroke="#111" stroke-width="24"/>
      <path d="M -10 -27 V 27 H 0 A 27 27 0 0 0 0 -27 Z" stroke="url(#dred)" stroke-width="12"/>
    </g>
    <g transform="translate(106 42) rotate(6) scale(0.9)">
      <circle r="23" stroke="#000" stroke-width="24" transform="translate(5 6)" opacity="0.3"/>
      <circle r="23" stroke="#111" stroke-width="24"/>
      <circle r="23" stroke="url(#dpurple)" stroke-width="12"/>
    </g>
    <g transform="translate(166 54) rotate(10) scale(0.9)">
      <path d="M 17 -19 C 10 -31 -19 -29 -17 -11 C -15 3 17 -3 17 13 C 17 31 -12 32 -19 19" stroke="#000" stroke-width="24" transform="translate(5 6)" opacity="0.3"/>
      <path d="M 17 -19 C 10 -31 -19 -29 -17 -11 C -15 3 17 -3 17 13 C 17 31 -12 32 -19 19" stroke="#111" stroke-width="24"/>
      <path d="M 17 -19 C 10 -31 -19 -29 -17 -11 C -15 3 17 -3 17 13 C 17 31 -12 32 -19 19" stroke="url(#dyellow)" stroke-width="12"/>
    </g>
  </g>
</svg>
