<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- DOSBox-X-NN: DOSBox-X's crossword of chunky letters ("DOS" down, "BOX" across), with NukemNet's
       trefoil as the shared O, the green X of DOSBox-X, and "NN" in NukemNet's white and orange. -->
  <defs>
    <linearGradient id="dred" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#d9361a"/></linearGradient>
    <linearGradient id="dblue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#1e6fd0"/></linearGradient>
    <linearGradient id="dyellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7a0"/><stop offset="1" stop-color="#f2c400"/></linearGradient>
    <linearGradient id="dgreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8f0a0"/><stop offset="0.5" stop-color="#3fc83a"/><stop offset="1" stop-color="#1a8526"/></linearGradient>
    <linearGradient id="nwhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d1d9"/></linearGradient>
    <linearGradient id="norange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#e8901e"/></linearGradient>
    <radialGradient id="disc" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#3a4a9a"/><stop offset="1" stop-color="#141a40"/></radialGradient>
    <radialGradient id="blade" cx="0.5" cy="0.3" r="0.8"><stop offset="0" stop-color="#9cf59a"/><stop offset="0.6" stop-color="#3cbf3f"/><stop offset="1" stop-color="#176b22"/></radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#fffbb0"/><stop offset="0.6" stop-color="#ffd12a"/><stop offset="1" stop-color="#c98a00"/></radialGradient>
    <path id="b" d="M 0 -9 A 9 9 0 0 1 7.8 -4.5 L 22.5 -13 A 26 26 0 0 0 0 -26 Z"/>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- D (top of DOS) -->
    <g transform="translate(116 42) rotate(-8)">
      <path d="M -10 -24 V 24 H 0 A 24 24 0 0 0 0 -24 Z" stroke="#000" stroke-width="24" opacity="0.3" transform="translate(4 5)"/>
      <path d="M -10 -24 V 24 H 0 A 24 24 0 0 0 0 -24 Z" stroke="#111" stroke-width="24"/>
      <path d="M -10 -24 V 24 H 0 A 24 24 0 0 0 0 -24 Z" stroke="url(#dred)" stroke-width="12"/>
    </g>
    <!-- B (start of BOX) -->
    <g transform="translate(46 122) rotate(-6)">
      <path d="M -12 -24 V 24 H 2 C 22 24 22 1 2 1 H -12 M -12 1 H 0 C 17 1 17 -24 0 -24 H -12" stroke="#000" stroke-width="24" opacity="0.3" transform="translate(4 5)"/>
      <path d="M -12 -24 V 24 H 2 C 22 24 22 1 2 1 H -12 M -12 1 H 0 C 17 1 17 -24 0 -24 H -12" stroke="#111" stroke-width="24"/>
      <path d="M -12 -24 V 24 H 2 C 22 24 22 1 2 1 H -12 M -12 1 H 0 C 17 1 17 -24 0 -24 H -12" stroke="url(#dblue)" stroke-width="12"/>
    </g>
    <!-- X (end of BOX, DOSBox-X's green X) -->
    <g transform="translate(196 118) rotate(6)">
      <path d="M -26 -28 L 26 28 M 26 -28 L -26 28" stroke="#000" stroke-width="34" opacity="0.3" transform="translate(4 5)"/>
      <path d="M -26 -28 L 26 28 M 26 -28 L -26 28" stroke="#111" stroke-width="34"/>
      <path d="M -26 -28 L 26 28 M 26 -28 L -26 28" stroke="url(#dgreen)" stroke-width="20"/>
      <path d="M -21 -23 L -8 -9" stroke="#fff" stroke-width="5" opacity="0.6"/>
    </g>
    <!-- S (bottom of DOS) -->
    <g transform="translate(112 204) rotate(8)">
      <path d="M 16 -18 C 9 -29 -18 -27 -16 -10 C -14 3 16 -3 16 12 C 16 29 -11 30 -18 18" stroke="#000" stroke-width="24" opacity="0.3" transform="translate(4 5)"/>
      <path d="M 16 -18 C 9 -29 -18 -27 -16 -10 C -14 3 16 -3 16 12 C 16 29 -11 30 -18 18" stroke="#111" stroke-width="24"/>
      <path d="M 16 -18 C 9 -29 -18 -27 -16 -10 C -14 3 16 -3 16 12 C 16 29 -11 30 -18 18" stroke="url(#dyellow)" stroke-width="12"/>
    </g>
    <!-- NN (NukemNet) on its own tag, so it does not read as part of "DOS" -->
    <g transform="translate(200 206) rotate(-6)">
      <rect x="-44" y="-30" width="88" height="60" rx="14" fill="#000" opacity="0.3" transform="translate(4 5)" stroke="none"/>
      <rect x="-44" y="-30" width="88" height="60" rx="14" fill="#1b1f3f" stroke="#111" stroke-width="6"/>
      <rect x="-38" y="-24" width="76" height="48" rx="9" fill="none" stroke="#e8901e" stroke-width="3"/>
      <path d="M -28 15 V -15 L -8 15 V -15" stroke="url(#nwhite)" stroke-width="9"/>
      <path d="M 8 15 V -15 L 28 15 V -15" stroke="url(#norange)" stroke-width="9"/>
    </g>
  </g>
  <!-- O shared by DOS and BOX: NukemNet's trefoil -->
  <g transform="translate(118 122)">
    <circle r="40" fill="#000" opacity="0.3" transform="translate(4 5)"/>
    <circle r="40" fill="#111"/>
    <circle r="33" fill="url(#disc)"/>
    <g fill="url(#blade)" stroke="#0a3a10" stroke-width="2" stroke-linejoin="round">
      <use href="#b" transform="rotate(-30)"/><use href="#b" transform="rotate(90)"/><use href="#b" transform="rotate(210)"/>
    </g>
    <circle r="7" fill="url(#core)" stroke="#5a4200" stroke-width="2"/>
  </g>
</svg>
